<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      margin: 0;
      background: #0A0C10;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    .badge {
      font-size: 10px;
      font-family: monospace;
      color: #F59E0B;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .goal-box {
      background: #141820;
      border: 1px solid #2D3446;
      border-radius: 12px;
      padding: 12px;
      margin: 10px 0;
    }
    .input-box {
      width: 100%;
      box-sizing: border-box;
      background: #060709;
      border: 1px solid #2D3446;
      border-radius: 8px;
      padding: 8px 10px;
      color: white;
      font-size: 12px;
      margin-top: 8px;
    }
    .btn {
      width: 100%;
      background: #F59E0B;
      color: #060709;
      border: none;
      border-radius: 8px;
      padding: 8px;
      font-weight: 600;
      font-size: 12px;
      margin-top: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="badge">ONE THING</div>
  <div class="goal-box">
    <div style="font-size: 11px; color: #94A3B8;">Current Intention</div>
    <div id="goal-text" style="font-size: 14px; font-weight: 500; margin-top: 4px;">No active session</div>
  </div>
  <div style="font-size: 11px; color: #94A3B8; margin-top: 12px;">Distraction Inbox (Save for later)</div>
  <input type="text" id="inbox-input" class="input-box" placeholder="Quick thought...">
  <button id="inbox-btn" class="btn">Offload Thought</button>

  <script>
    chrome.storage.local.get(['activeSession'], (res) => {
      if (res.activeSession?.intentionTitle) {
        document.getElementById('goal-text').textContent = res.activeSession.intentionTitle;
      }
    });

    document.getElementById('inbox-btn').addEventListener('click', () => {
      const val = document.getElementById('inbox-input').value;
      if (!val) return;
      alert('Thought saved to Distraction Inbox.');
      document.getElementById('inbox-input').value = '';
    });
  </script>
</body>
</html>
